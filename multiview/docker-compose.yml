# Multiview auf dem Kesher-Server.
#   docker compose up -d --build
# Editor:  http://<server-ip>:8090/ (nach der HTTPS-Umstellung https://, siehe Kesher/server-config/Caddyfile.jms)
# Monitor: http://127.0.0.1:8090/output.html?id=1 (zeigt der Kiosk auf dem HDMI-Ausgang)
services:
  multiview:
    build: .
    image: jms-multiview:latest
    container_name: multiview
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8090"
      # Nur lokal lauschen, von außen über Caddy als https://<server-ip>:8090
      # (Caddyfile.jms, auf dem JMS-Server seit 14.10.2026). Ohne Caddy davor auskommentieren.
      HOST: "127.0.0.1"
      # Kesher läuft auf demselben Server (nur auf 127.0.0.1 erreichbar)
      KESHER_URL: "http://127.0.0.1:8080"
      # Zentrale Anmeldung: gemeinsames Geheimnis mit Kesher (aus .env, gleicher Wert wie dort)
      JMS_AUTH_SECRET: ${JMS_AUTH_SECRET:-}
      JMS_DEVICE_PROXY_SECRET: ${JMS_DEVICE_PROXY_SECRET:?Device proxy secret required}
      JMS_KESHER_DEVICE_KEY_FILE: /run/jms-device/kesher.key
      JMS_SATELLITE_TLS_DIR: /run/jms-device/satellite
      # Zentrale Adresse für den Abgleich der Anmeldung zwischen IP und .local-Namen
      # (dort gilt ein Cookie für alle Dienste; die .local-Seiten holen die Anmeldung von dort)
      JMS_SSO_ORIGIN: "https://192.168.0.230:8090"
    volumes:
      - multiview-data:/data
      - /etc/jms-auth/services/kesher.key:/run/jms-device/kesher.key:ro
      - /etc/jms-auth/satellite-tls:/run/jms-device/satellite:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  multiview-data:
