# Dashboard (Homepage) auf dem JMS-Server – zwei Seiten (Tabs, siehe settings.yaml):
#   Start: die Dienste für alle (Intercom, JMS Control, Fernbedienung …)
#   Abmelden und Konto wechseln stehen oben in der Konto-Leiste (custom.js)
#   Admin: Companion, Portainer und alles über den Server (Auslastung, Container) und die Raspberry Pis
# Alle Dateien aus diesem Ordner nach /opt/homelab/config/homepage/ kopieren, Homepage
# lädt sie ohne Neustart. Links gehen auf die IP-Adressen (die Namen kennt der DNS im
# LAN nicht, siehe BETRIEB.md), die zentrale Anmeldung fragt beim ersten Aufruf nach
# Code, Name und Rolle. Die Status-Punkte kommen über den Docker-Proxy (docker.yaml).

# ----------------------------------------------------------------------------- Start

- Dienste:
    - Intercom:
        href: https://192.168.0.21:8443
        description: Kesher – sprechen, hören, Chat
        icon: mdi-headset
        server: local-docker
        container: kesher
    - Raspberry fernsteuern:
        href: https://192.168.0.21:8443/?login=raspberry
        description: Kesher – eine Raspberry-Station übernehmen und steuern
        icon: mdi-raspberry-pi
    - JMS Control:
        href: https://192.168.0.21:8090
        description: Die Zentrale – Multiviews, Layouts, Eingänge, Benutzer und Rechte
        icon: mdi-monitor-dashboard
        server: local-docker
        container: multiview
    - Intercom-Chat:
        href: https://192.168.0.21:8090/remote.html?tab=chat
        description: Chat mit den anderen Rollen lesen und schreiben
        icon: mdi-chat-processing
    - Nachricht auf Bühne:
        href: https://192.168.0.21:8090/remote.html?tab=beamer
        description: Text an ProPresenter – der Bediener zeigt ihn auf dem Beamer
        icon: mdi-projector-screen
    - Nachricht auf Stage Display:
        href: https://192.168.0.21:8090/remote.html?tab=stage
        description: Kurze Nachricht für die Bühne (Stage Display)
        icon: mdi-message-text
    - Prediger:
        href: https://192.168.0.21:8090/prediger.html
        description: Folien, Notizen und Zeit für die Bühne
        icon: mdi-account-voice

# ----------------------------------------------------------------------------- Admin

- Verwaltung:
    - Companion:
        href: https://192.168.0.21:8000
        description: Stream-Deck-Tasten und Automationen
        icon: mdi-gesture-tap-button
    - Portainer:
        href: https://192.168.0.21:9443
        description: Container verwalten (eigenes Passwort)
        icon: mdi-docker
        server: local-docker
        container: portainer
    - Glances:
        href: https://192.168.0.21:61208
        description: Auslastung, Prozesse und Temperaturen im Detail
        icon: mdi-chart-line
        server: local-docker
        container: glances
    - Lokaler DNS:
        href: https://dns.local
        description: AdGuard Home – lokale Namen (nur im LAN-Kabelnetz)
        icon: mdi-dns
        server: local-docker
        container: adguardhome
    - Router:
        href: http://192.168.0.250
        description: Speedport, WLAN „JMS Interkom“ (Gerätepasswort nötig)
        icon: mdi-router-wireless

- Server:
    - Prozessor:
        icon: mdi-cpu-64-bit
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: cpu
          refreshInterval: 5000
    - Arbeitsspeicher:
        icon: mdi-memory
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: memory
          refreshInterval: 5000
    - Temperatur:
        icon: mdi-thermometer
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: sensor:Package id 0
          refreshInterval: 5000
    - Systemlaufwerk:
        icon: mdi-harddisk
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: fs:/rootfs
          refreshInterval: 10000
    - Laufwerk lesen/schreiben:
        icon: mdi-swap-vertical
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: disk:sda
          refreshInterval: 5000
    - Prozesse:
        icon: mdi-format-list-bulleted
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: process
          refreshInterval: 5000
    - Container-Auslastung:
        icon: mdi-docker
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: containers
          refreshInterval: 5000

# Raspberry-Stationen: je Pi eine Untergruppe mit denselben Werten wie beim Server. Auf dem Pi läuft
# Glances (Kesher/deploy/raspberry-pi/install-glances.sh), es antwortet nur dem Server. Die Adresse ist
# die aktuelle WLAN-IP des Pi (JMS Control → Einstellungen → Raspberry Pis zeigt sie) – ändert sie
# sich, hier anpassen. Neuer Pi: Untergruppe kopieren, Name und Adresse ändern.
- Raspberry Pis:
    - Kamera-1:
          - Prozessor:
              icon: mdi-cpu-64-bit
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: cpu
                refreshInterval: 15000
          - Arbeitsspeicher:
              icon: mdi-memory
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: memory
                refreshInterval: 15000
          - Temperatur:
              icon: mdi-thermometer
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: sensor:cpu_thermal 0
                refreshInterval: 15000
          - Speicherkarte:
              icon: mdi-micro-sd
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: fs:/
                refreshInterval: 30000
          - Speicherkarte lesen/schreiben:
              icon: mdi-swap-vertical
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: disk:mmcblk0
                refreshInterval: 15000
          - WLAN:
              icon: mdi-wifi
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: network:wlan0
                refreshInterval: 15000
          - Prozesse:
              icon: mdi-format-list-bulleted
              widget:
                type: glances
                url: http://192.168.0.161:61208
                version: 4
                metric: process
                refreshInterval: 15000

- Container:
    - Kesher:
        icon: mdi-headset
        description: Intercom-Server
        server: local-docker
        container: kesher
        showStats: true
    - JMS Control:
        icon: mdi-monitor-dashboard
        description: Zentrale mit Multiviews, MediaMTX und zentraler Anmeldung
        server: local-docker
        container: multiview
        showStats: true
    - Homepage:
        icon: mdi-view-dashboard
        description: Dieses Dashboard
        server: local-docker
        container: homepage
    - Glances:
        icon: mdi-chart-line
        description: Messwerte für den Server-Bereich
        server: local-docker
        container: glances
    - Portainer:
        icon: mdi-docker
        description: Container-Verwaltung
        server: local-docker
        container: portainer
    - AdGuard Home:
        icon: mdi-dns
        description: Lokaler DNS
        server: local-docker
        container: adguardhome
    - Docker-Proxy:
        icon: mdi-lan-connect
        description: Nur-Lese-Zugang für Dashboard und Glances
        server: local-docker
        container: homelab-dockerproxy
    - Tailscale (Lasse):
        icon: mdi-vpn
        description: Fernzugang
        server: local-docker
        container: tailscale-lasse
